name: LemonPlayer

options:
  bundleIdPrefix: com.lemonplayer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.6"

packages:
  LemonCore:
    path: Packages/LemonCore
  LemonNetwork:
    path: Packages/LemonNetwork
  LemonGuangya:
    path: Packages/LemonGuangya
  LemonSubtitle:
    path: Packages/LemonSubtitle
  LemonPlayback:
    path: Packages/LemonPlayback
  LemonMedia:
    path: Packages/LemonMedia
  LemonPersistence:
    path: Packages/LemonPersistence
  LemonDownloads:
    path: Packages/LemonDownloads

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # CocoaPods 的 embed/copy 脚本（rsync）与 user script sandbox 不兼容，必须关闭
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LemonPlayer:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/LemonPlayer
        excludes:
          - Info.plist
    info:
      path: Sources/LemonPlayer/Info.plist
      properties:
        CFBundleDisplayName: LemonPlayer
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lemonplayer.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LemonCore
      - package: LemonNetwork
      - package: LemonGuangya
      - package: LemonSubtitle
      - package: LemonPlayback
      - package: LemonMedia
      - package: LemonPersistence
      - package: LemonDownloads

  LemonPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/LemonPlayerUITests
    dependencies:
      - target: LemonPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lemonplayer.ios.uitests
        TEST_TARGET_NAME: LemonPlayer

schemes:
  LemonPlayer:
    build:
      targets:
        LemonPlayer: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - LemonPlayerUITests
