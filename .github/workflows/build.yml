name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯逻辑层单测：跑在 Linux 容器里，秒级完成、不占 macOS 额度
  test:
    runs-on: ubuntu-24.04
    container: swift:6.0
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Package tests (Linux Swift 6.0)
        run: |
          set -euo pipefail
          for p in LemonCore LemonNetwork LemonGuangya LemonSubtitle LemonPlayback LemonMedia LemonDownloads; do
            echo "::group::$p"
            timeout 300 swift test --package-path "Packages/$p"
            echo "::endgroup::"
          done

  # iOS 构建 + 未签名 IPA：只在 macOS 上跑，避免和单测抢时间
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: "Guard: no UTF-8 BOM in manifests"
        run: |
          if grep -rl $'\xEF\xBB\xBF' Packages/*/Package.swift project.yml 2>/dev/null; then
            echo "::error::UTF-8 BOM found in Package.swift/project.yml (SwiftPM cannot parse it)"; exit 1
          fi

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          xcrun simctl list devices available | head -20

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Assert Xcode version
        run: |
          test "$(xcodebuild -version | head -1)" = "Xcode 26.6" || {
            echo "::error::Xcode version drift; update XCODE_APP in build.yml"; exit 1; }
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate --spec project.yml
          ls -la LemonPlayer.xcodeproj

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            Pods
          key: pods-${{ hashFiles('Podfile') }}

      - name: Install Pods (MobileVLCKit)
        run: |
          pod install
          ls -la LemonPlayer.xcworkspace

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild build \
            -workspace LemonPlayer.xcworkspace \
            -scheme LemonPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: UI smoke test (simulator)
        # 观测阶段：模拟器 UI 测试在新环境首次引导较慢，先不阻塞出包；
        # 连续绿 3 次后改为必须通过（去掉 continue-on-error）。
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun simctl list devices available | grep -E "iPhone" | head -5
          xcrun simctl boot "iPhone 17" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 17" -b || true
          xcodebuild test \
            -workspace LemonPlayer.xcworkspace \
            -scheme LemonPlayer \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath .build/DerivedData \
            -only-testing:LemonPlayerUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (unsigned)
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild archive \
            -workspace LemonPlayer.xcworkspace \
            -scheme LemonPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath .build/LemonPlayer.xcarchive \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p .build/Payload
          cp -R .build/LemonPlayer.xcarchive/Products/Applications/LemonPlayer.app .build/Payload/
          cd .build
          zip -qrX LemonPlayer-unsigned.ipa Payload
          shasum -a 256 LemonPlayer-unsigned.ipa
          du -h LemonPlayer-unsigned.ipa

      - name: Upload unsigned IPA
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: LemonPlayer-unsigned-ipa
          path: .build/LemonPlayer-unsigned.ipa
          retention-days: 14
