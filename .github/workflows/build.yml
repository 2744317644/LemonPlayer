name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 2026-11 实测：macos-26 (arm64) 高峰排队可达 1 小时甚至被取消；
    # 切到 Intel 容量池做兜底。若该标签不可用，CI 会立即报 "no runner matching labels"。
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Guard: no UTF-8 BOM in manifests"
        run: |
          if grep -rl $'\xEF\xBB\xBF' Packages/*/Package.swift project.yml 2>/dev/null; then
            echo "::error::UTF-8 BOM found in Package.swift/project.yml (SwiftPM cannot parse it)"; exit 1
          fi

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          xcrun simctl list devices available | head -20

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Assert Xcode version
        run: |
          test "$(xcodebuild -version | head -1)" = "Xcode 26.6" || {
            echo "::error::Xcode version drift; update XCODE_APP in build.yml"; exit 1; }
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate --spec project.yml
          ls -la LemonPlayer.xcodeproj

      - name: Swift package tests
        run: |
          swift test --package-path Packages/LemonCore
          swift test --package-path Packages/LemonSubtitle
          swift test --package-path Packages/LemonNetwork
          swift test --package-path Packages/LemonGuangya

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild build \
            -project LemonPlayer.xcodeproj \
            -scheme LemonPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (unsigned)
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild archive \
            -project LemonPlayer.xcodeproj \
            -scheme LemonPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath .build/LemonPlayer.xcarchive \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p .build/Payload
          cp -R .build/LemonPlayer.xcarchive/Products/Applications/LemonPlayer.app .build/Payload/
          cd .build
          zip -qrX LemonPlayer-unsigned.ipa Payload
          shasum -a 256 LemonPlayer-unsigned.ipa
          du -h LemonPlayer-unsigned.ipa

      - name: Upload unsigned IPA
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: LemonPlayer-unsigned-ipa
          path: .build/LemonPlayer-unsigned.ipa
          retention-days: 14
