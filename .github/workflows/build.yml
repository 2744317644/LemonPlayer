name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          xcrun simctl list devices available | head -20

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate --spec project.yml
          ls -la LemonPlayer.xcodeproj

      - name: Swift package tests
        run: |
          swift test --package-path Packages/LemonCore
          swift test --package-path Packages/LemonSubtitle

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild build \
            -project LemonPlayer.xcodeproj \
            -scheme LemonPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (unsigned)
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild archive \
            -project LemonPlayer.xcodeproj \
            -scheme LemonPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath .build/LemonPlayer.xcarchive \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p .build/Payload
          cp -R .build/LemonPlayer.xcarchive/Products/Applications/LemonPlayer.app .build/Payload/
          cd .build
          zip -qr LemonPlayer-unsigned.ipa Payload
          shasum -a 256 LemonPlayer-unsigned.ipa
          du -h LemonPlayer-unsigned.ipa

      - name: Upload unsigned IPA
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: LemonPlayer-unsigned-ipa
          path: .build/LemonPlayer-unsigned.ipa
          retention-days: 14
