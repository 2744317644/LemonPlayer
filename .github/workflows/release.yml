name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Guard: no UTF-8 BOM in manifests"
        run: |
          if grep -rl $'\xEF\xBB\xBF' Packages/*/Package.swift project.yml 2>/dev/null; then
            echo "::error::UTF-8 BOM found in Package.swift/project.yml"; exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            Pods
          key: pods-${{ hashFiles('Podfile') }}

      - name: Install Pods
        run: pod install

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace LemonPlayer.xcworkspace \
            -scheme LemonPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath .build/LemonPlayer.xcarchive \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p .build/Payload
          cp -R .build/LemonPlayer.xcarchive/Products/Applications/LemonPlayer.app .build/Payload/
          cd .build
          zip -qrX LemonPlayer-unsigned.ipa Payload
          shasum -a 256 LemonPlayer-unsigned.ipa > LemonPlayer-unsigned.ipa.sha256
          cat LemonPlayer-unsigned.ipa.sha256
          du -h LemonPlayer-unsigned.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LemonPlayer ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            .build/LemonPlayer-unsigned.ipa
            .build/LemonPlayer-unsigned.ipa.sha256
          body: |
            ## 安装

            1. 下载 `LemonPlayer-unsigned.ipa`（未签名，需自签）
            2. 使用 Sideloadly / AltStore 以你的 Apple ID 重签安装
            3. 免费账号签名 7 天有效，过期后重新自签即可（数据保留）

            详细步骤见 [docs/INSTALL.md](https://github.com/2744317644/LemonPlayer/blob/main/docs/INSTALL.md)。

            ## 校验

            ```
            shasum -a 256 -c LemonPlayer-unsigned.ipa.sha256
            ```
